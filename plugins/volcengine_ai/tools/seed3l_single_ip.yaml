identity:
  name: Seed3lSingleIp
  author: parkerwen
  label:
    en_US: Seed3lSingleIp
    zh_Hans: 图生图3.0-角色特征保持DreamO
    pt_BR: Seed3lSingleIp
description:
  human:
    en_US: Image-to-Image 3.0 - Character Feature Preservation DreamO is based on the self-developed Seedream 3.0 model, integrating proprietary subject preservation capabilities. It can maintain consistency between the output image's subject appearance/facial features/style characteristics and the input "single reference image", while supporting adjustments through text prompts. Subject appearance, facial features, and style characteristics work together with the input text during the generation process to create images that are consistent with the reference image's subject while conforming to the text description, achieving a balance between feature preservation and creative generation.
    zh_Hans: 图生图3.0—角色特征保持DreamO基于Seedream 3.0自研模型，集成了自研的主体保持能力，可以保持输出图片主体外观/面部特征/风格特征与输入的「单图参考图」一致，且支持通过文本prompt进行调节。主体外观、面部特征和风格特征，三者在生图过程中跟输入文本共同起作用，生成跟输入参考图的主体一致又符合文本描述的图片，实现特征保持与创意生成的平衡。
    pt_BR: Imagem para Imagem 3.0 - Preservação de Características de Personagem DreamO é baseado no modelo Seedream 3.0 desenvolvido internamente, integrando capacidades proprietárias de preservação de sujeito. Pode manter a consistência entre a aparência do sujeito/características faciais/características de estilo da imagem de saída e a "imagem de referência única" de entrada, enquanto suporta ajustes através de prompts de texto. Aparência do sujeito, características faciais e características de estilo trabalham juntas com o texto de entrada durante o processo de geração para criar imagens que são consistentes com o sujeito da imagem de referência enquanto se conformam à descrição do texto, alcançando um equilíbrio entre preservação de características e geração criativa.
  llm: Image-to-Image 3.0 - Character Feature Preservation DreamO is based on the self-developed Seedream 3.0 model, integrating proprietary subject preservation capabilities. It can maintain consistency between the output image's subject appearance/facial features/style characteristics and the input "single reference image", while supporting adjustments through text prompts. Subject appearance, facial features, and style characteristics work together with the input text during the generation process to create images that are consistent with the reference image's subject while conforming to the text description, achieving a balance between feature preservation and creative generation. 
parameters:
  - name: image_files
    type: files
    required: true
    label:
      en_US: Image FILES
      zh_Hans: 图片文件
      pt_BR: Arquivos de Imagem
    human_description:
      en_US: Image files.
      zh_Hans: 图片文件。
      pt_BR: Arquivos de Imagem.
    llm_description: Image files.
    form: llm
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 用于编辑图像的提示词。
      pt_BR: Prompt
    human_description:
      en_US: Prompt for image editing.
      zh_Hans: 用于编辑图像的提示词。
      pt_BR: Prompt para edição de imagem.
    llm_description: Prompt for image editing.
    form: llm
  - name: seed
    type: number
    required: false
    default: -1
    label:
      en_US: Seed
      zh_Hans: 种子
      pt_BR: Semente
    human_description:
      en_US: Random seed, which serves as the basis for determining the initial state of diffusion. Default is -1 (random). If the random seed is the same positive integer and all other parameters are consistent, the generated image will likely have a consistent effect.
      zh_Hans: 随机种子，作为确定扩散初始状态的基础，默认-1（随机）。若随机种子为相同正整数且其他参数均一致，则生成图片极大概率效果一致
      pt_BR: Semente aleatória, que serve como base para determinar o estado inicial da difusão. O padrão é -1 (aleatório). Se a semente aleatória for o mesmo número inteiro positivo e todos os outros parâmetros forem consistentes, a imagem gerada provavelmente terá um efeito consistente.
    llm_description: Random seed, which serves as the basis for determining the initial state of diffusion. Default is -1 (random). If the random seed is the same positive integer and all other parameters are consistent, the generated image will likely have a consistent effect.
    form: llm
  - name: use_rephraser
    type: boolean
    required: false
    default: true
    label:
      en_US: User Rephraser
      zh_Hans: 用户改写器
      pt_BR: Reescritor do Usuário 
    human_description:
      en_US: Whether to rewrite the input text prompt to optimize the effect. It is recommended to keep it enabled under normal conditions. If the input text is particularly long & there is a strong requirement not to change the input prompt content & there is a strong requirement to shorten the time consumption, this parameter can be disabled
      zh_Hans: 是否对输入文本提示词进行改写，以优化效果，正常状态建议保持开启，如果输入文本特别长&强诉求不能改变输入提示词内容&强诉求缩短耗时，可关闭此参数
      pt_BR: Se deve reescrever o prompt de texto de entrada para otimizar o efeito. É recomendado manter habilitado em condições normais. Se o texto de entrada for particularmente longo & houver uma forte exigência de não alterar o conteúdo do prompt de entrada & houver uma forte exigência de reduzir o tempo de consumo, este parâmetro pode ser desabilitado
    llm_description: Whether to rewrite the input text prompt to optimize the effect. It is recommended to keep it enabled under normal conditions. If the input text is particularly long & there is a strong requirement not to change the input prompt content & there is a strong requirement to shorten the time consumption, this parameter can be disabled 
    form: form
  - name: width
    type: number
    required: false
    default: 1328
    min: 512
    max: 2048
    label:
      en_US: Width
      zh_Hans: 宽度
      pt_BR: Largura
    human_description:
      en_US: Width of the generated image. Default is 1328.
      zh_Hans: 生成图像的宽
      pt_BR: Largura da imagem gerada. O padrão é 1328.
    llm_description: Width of the generated image. Default is 1328.
    form: llm
  - name: height
    type: number
    required: false
    default: 1328
    min: 512
    max: 2048
    label:
      en_US: Height
      zh_Hans: 高度
      pt_BR: Altura
    human_description:
      en_US: Height of the generated image. Default is 1328.
      zh_Hans: 生成图像的高
      pt_BR: Altura da imagem gerada. O padrão é 1328.
    llm_description: Height of the generated image. Default is 1328.
    form: llm
  - name: add_logo
    type: boolean
    required: false
    default: false
    label:
      en_US: Add Logo
      zh_Hans: 添加 Logo
      pt_BR: Adicionar Logo
    human_description:
      en_US: Whether to add a watermark. True to add, False not to add. Default is not to add.
      zh_Hans: 是否添加水印。True为添加，False不添加。默认不添加
      pt_BR: Se deve adicionar uma marca d'água. True para adicionar, False para não adicionar. O padrão é não adicionar.
    llm_description: Whether to add a watermark. True to add, False not to add. Default is not to add.
    form: form
  - name: position
    type: select
    required: false
    default: 0
    label:
      en_US: Position
      zh_Hans: 位置
      pt_BR: Posição
    options:
      - label:
          en_US: Bottom Right
          zh_Hans: 右下角
          pt_BR: Inferior Direito
        value: 0
      - label:
          en_US: Bottom Left
          zh_Hans: 左下角
          pt_BR: Inferior Esquerdo
        value: 1
      - label:
          en_US: Top Left
          zh_Hans: 左上角
          pt_BR: Superior Esquerdo
        value: 2
      - label:
          en_US: Top Right
          zh_Hans: 右上角
          pt_BR: Superior Direito
        value: 3
    human_description:
      en_US: Position of the watermark.
      zh_Hans: 水印的位置
      pt_BR: Posição da marca d'água.
    llm_description: Position of the watermark.
    form: llm
  - name: language
    type: select
    required: false
    default: 0
    label:
      en_US: Language
      zh_Hans: 水印的语言
      pt_BR: Idioma
    options:
      - label:
          en_US: Chinese (AI-generated)
          zh_Hans: 中文（AI生成）
          pt_BR: Chinês (gerado por IA)
        value: 0
      - label:
          en_US: English (AI-generated)
          zh_Hans: 英文（Generated by AI）
          pt_BR: Inglês (gerado por IA)
        value: 1
    human_description:
      en_US: Language of the watermark.
      zh_Hans: 水印的语言
      pt_BR: Idioma da marca d'água.
    llm_description: Language of the watermark.
    form: llm
  - name: opacity
    type: number
    required: false
    default: 0.3
    min: 0
    max: 1
    label:
      en_US: Opacity
      zh_Hans: 透明度
      pt_BR: Opacidade
    human_description:
      en_US: Opacity of the watermark, ranging from 0 to 1, where 1 is fully opaque. Default is 0.3.
      zh_Hans: 水印的不透明度，取值范围0-1，1表示完全不透明，默认0.3
      pt_BR: Opacidade da marca d'água, variando de 0 a 1, onde 1 é totalmente opaco. O padrão é 0.3.
    llm_description: Opacity of the watermark, ranging from 0 to 1, where 1 is fully opaque. Default is 0.3.
    form: llm
  - name: logo_text_content
    type: string
    required: false
    label:
      en_US: Logo Text Content
      zh_Hans: Logo 文本内容
      pt_BR: Conteúdo do Texto do Logo
    human_description:
      en_US: Custom content for the watermark text.
      zh_Hans: 明水印自定义内容
      pt_BR: Conteúdo personalizado para o texto da marca d'água.
    llm_description: Custom content for the watermark text.
    form: llm
  - name: return_url
    type: boolean
    required: false
    default: true
    label:
      en_US: Return URL
      zh_Hans: 返回 URL
      pt_BR: Retornar URL
    human_description:
      en_US: Whether to return the image URL (valid for 24 hours).
      zh_Hans: 输出是否返回图片链接 （链接有效期为24小时）
      pt_BR: Se deve retornar a URL da imagem (válida por 24 horas).
    llm_description: Whether to return the image URL (valid for 24 hours).
    form: form
extra:
  python:
    source: tools/seed3l_single_ip.py
